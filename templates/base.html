<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · RMS 分贓表</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <strong class="brand">RMS 分贓表</strong>
    <nav>
      <a href="{{ url_for('index') }}">總覽</a>
      <a href="{{ url_for('runs') }}">分贓紀錄</a>
      <a href="{{ url_for('drops') }}">掉落物</a>
      <a href="{{ url_for('settings') }}">匯入 / 設定</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='table.js') }}" defer></script>
</body>
</html>

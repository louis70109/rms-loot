{% extends "base.html" %}
{% block title %}綁定名字{% endblock %}
{% block content %}
<section class="card">
  <h2>第一次來？先告訴本喵你是誰喵</h2>
  <p class="hint">選一個名字綁給你的 Discord 帳號喵。每個名字只能綁一次，綁好之後本喵只允許你改自己名下的掉落物喵。</p>
  {% if choices %}
  <form method="post" action="{{ url_for('discord_bind') }}" class="form">
    {% for n in choices %}
      <label class="check"><input type="radio" name="name" value="{{ n }}" required> {{ n }}</label>
    {% endfor %}
    <button class="btn">綁定</button>
  </form>
  {% else %}
    <p class="muted">目前沒有可以綁的名字喵，去找管理者喵。</p>
  {% endif %}
</section>
{% endblock %}

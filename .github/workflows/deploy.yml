name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      RMS_SECRET_KEY: ${{ secrets.RMS_SECRET_KEY }}
      RMS_API_TOKEN: ${{ secrets.RMS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure fly app and volume exist
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          if ! flyctl status -a rms-loot-nj >/dev/null 2>&1; then
            flyctl apps create rms-loot-nj --org "${FLY_ORG:-personal}"
          fi
          if ! flyctl volumes list -a rms-loot-nj 2>/dev/null | grep -q rms_data; then
            flyctl volumes create rms_data --region nrt --size 1 -a rms-loot-nj -y
          fi
      - name: Stage app secrets
        run: |
          flyctl secrets set --stage -a rms-loot-nj \
            DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" \
            DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" \
            RMS_SECRET_KEY="$RMS_SECRET_KEY"
          # 沒設 GitHub secret 時不覆蓋，避免把已經用 flyctl 設好的 token 清掉（API 會維持關閉）
          if [ -n "$RMS_API_TOKEN" ]; then
            flyctl secrets set --stage -a rms-loot-nj RMS_API_TOKEN="$RMS_API_TOKEN"
          fi
      - name: Deploy to fly.io
        run: flyctl deploy --remote-only -a rms-loot-nj

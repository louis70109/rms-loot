app = "rms-loot-nj"
primary_region = "nrt"

[env]
  RMS_DB = "/data/rms_loot.db"
  RMS_REQUIRE_AUTH = "1"

[mounts]
  source = "rms_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
